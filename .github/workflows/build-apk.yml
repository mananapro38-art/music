name: Build debug APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Decode source bundle
        run: |
          base64 -d source.zip.b64 > source.zip
          unzip -q source.zip

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Unit tests
        working-directory: no-limit-music-v0.1
        run: gradle --no-daemon testDebugUnitTest

      - name: Build debug APK
        working-directory: no-limit-music-v0.1
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: no-limit-music-v0.1-debug
          path: no-limit-music-v0.1/app/build/outputs/apk/debug/app-debug.apk
