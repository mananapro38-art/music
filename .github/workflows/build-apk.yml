name: Build debug APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      NLM_KEYSTORE_PASSWORD: ${{ secrets.NLM_SIGNING_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Require stable signing secret
        run: |
          if [ -z "$NLM_KEYSTORE_PASSWORD" ]; then
            echo "NLM_SIGNING_PASSWORD repository secret is required for update-safe builds."
            exit 1
          fi

      - name: Decrypt stable signing key
        run: |
          base64 -d signing/no-limit-music-release.jks.enc.b64 > "$RUNNER_TEMP/no-limit-music-release.jks.enc"
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 \
            -in "$RUNNER_TEMP/no-limit-music-release.jks.enc" \
            -out "$RUNNER_TEMP/no-limit-music-release.jks" \
            -pass env:NLM_KEYSTORE_PASSWORD
          keytool -list -v \
            -keystore "$RUNNER_TEMP/no-limit-music-release.jks" \
            -storepass "$NLM_KEYSTORE_PASSWORD" \
            -alias nolimitmusic | grep -E 'SHA256:'
          echo "NLM_KEYSTORE_PATH=$RUNNER_TEMP/no-limit-music-release.jks" >> "$GITHUB_ENV"

      - name: Install Android SDK packages
        run: |
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Unit tests
        run: gradle --no-daemon testDebugUnitTest

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Verify stable APK signing certificate
        run: |
          EXPECTED="FD91CC8FE34718E18680B80427851794E9CDFEC371B3DF5A5EED7CA9DF26C59E"
          APK_CERT=$("$ANDROID_SDK_ROOT/build-tools/35.0.0/apksigner" verify --print-certs \
            app/build/outputs/apk/debug/app-debug.apk | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -1 | tr '[:lower:]' '[:upper:]')
          echo "Expected certificate: $EXPECTED"
          echo "APK certificate:      $APK_CERT"
          test "$EXPECTED" = "$APK_CERT"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: no-limit-music-v1.7.2-debug
          path: app/build/outputs/apk/debug/app-debug.apk
