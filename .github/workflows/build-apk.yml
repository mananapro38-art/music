name: Build debug APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore stable test signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: no-limit-music-debug-keystore-v1
          fail-on-cache-miss: true

      - name: Verify signing key exists
        run: |
          test -s "$HOME/.android/debug.keystore"
          keytool -list -v \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android \
            -alias androiddebugkey | grep -E 'SHA256:'

      - name: Install Android SDK packages
        run: |
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Unit tests
        run: gradle --no-daemon testDebugUnitTest

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Verify APK signing certificate
        run: |
          KEY_CERT=$(keytool -list -v \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android \
            -alias androiddebugkey | sed -n 's/.*SHA256: //p' | head -1 | tr -d ':' | tr '[:lower:]' '[:upper:]')
          APK_CERT=$("$ANDROID_SDK_ROOT/build-tools/35.0.0/apksigner" verify --print-certs \
            app/build/outputs/apk/debug/app-debug.apk | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -1 | tr '[:lower:]' '[:upper:]')
          echo "Keystore certificate: $KEY_CERT"
          echo "APK certificate:      $APK_CERT"
          test -n "$KEY_CERT"
          test -n "$APK_CERT"
          test "$KEY_CERT" = "$APK_CERT"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: no-limit-music-v0.7-debug
          path: app/build/outputs/apk/debug/app-debug.apk
