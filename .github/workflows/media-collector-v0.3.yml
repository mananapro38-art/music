name: Build Media Collector v0.3 APK

on:
  push:
    branches: [ media-collector-v0.3 ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install Android 35 SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Lint and build debug APK
        run: gradle --no-daemon lintDebug assembleDebug

      - name: Prepare artifact
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk media-collector-v0.3-debug.apk
          sha256sum media-collector-v0.3-debug.apk > media-collector-v0.3-debug.apk.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: media-collector-v0.3-debug-apk
          path: |
            media-collector-v0.3-debug.apk
            media-collector-v0.3-debug.apk.sha256
          if-no-files-found: error
