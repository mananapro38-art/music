plugins {
    id 'com.android.application'
}

def nlmKeystorePath = System.getenv('NLM_KEYSTORE_PATH')
def nlmKeystorePassword = System.getenv('NLM_KEYSTORE_PASSWORD')

android {
    namespace 'com.nolimit.music'
    compileSdk 36

    defaultConfig {
        applicationId 'com.nolimit.music'
        minSdk 26
        targetSdk 36
        versionCode 16
        versionName '1.6.1'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    signingConfigs {
        stable {
            if (nlmKeystorePath != null && !nlmKeystorePath.trim().isEmpty()) {
                storeFile file(nlmKeystorePath)
                storePassword nlmKeystorePassword
                keyAlias 'nolimitmusic'
                keyPassword nlmKeystorePassword
            }
        }
    }

    buildTypes {
        debug {
            if (nlmKeystorePath != null && !nlmKeystorePath.trim().isEmpty()) signingConfig signingConfigs.stable
        }
        release {
            minifyEnabled false
            if (nlmKeystorePath != null && !nlmKeystorePath.trim().isEmpty()) signingConfig signingConfigs.stable
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packagingOptions {
        resources { excludes += ['META-INF/DEPENDENCIES', 'META-INF/LICENSE*', 'META-INF/NOTICE*'] }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'com.google.android.material:material:1.14.0'
    implementation 'androidx.media3:media3-exoplayer:1.11.0'
    implementation 'androidx.media3:media3-session:1.11.0'
    implementation 'com.github.Dimezis:BlurView:version-3.2.0'
    implementation 'io.github.junkfood02.youtubedl-android:library:0.18.1'
    implementation 'io.github.junkfood02.youtubedl-android:ffmpeg:0.18.1'
    implementation 'com.google.mlkit:text-recognition:16.0.1'
    implementation 'com.google.mlkit:text-recognition-korean:16.0.1'
    testImplementation 'junit:junit:4.13.2'
}
